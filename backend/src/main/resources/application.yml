server:
  port: ${PORT:8080}

spring:
  application:
    name: elite-wallet-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/elitewallet}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:elite-wallet-prototype-secret-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  rates:
    cache-ttl-seconds: ${RATES_CACHE_TTL_SECONDS:300}
    fallback-usd-to-kes: ${FALLBACK_USD_TO_KES:129.0}

mpesa:
  env: ${MPESA_ENV:sandbox}
  base-url: ${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
  consumer-key: ${MPESA_CONSUMER_KEY:}
  consumer-secret: ${MPESA_CONSUMER_SECRET:}
  passkey: ${MPESA_PASSKEY:}
  shortcode: ${MPESA_SHORTCODE:174379}
  initiator-name: ${MPESA_INITIATOR_NAME:}
  security-credential: ${MPESA_SECURITY_CREDENTIAL:}
  account-reference: ${MPESA_ACCOUNT_REFERENCE:EliteWallet}
  callback-url: ${MPESA_CALLBACK_URL:https://example.com/api/v1/webhooks/mpesa/stk-callback}
  b2c-result-url: ${MPESA_B2C_RESULT_URL:https://example.com/api/v1/webhooks/mpesa/b2c-result}
  b2c-queue-timeout-url: ${MPESA_B2C_QUEUE_TIMEOUT_URL:https://example.com/api/v1/webhooks/mpesa/b2c-result}

springdoc:
  swagger-ui:
    path: /swagger-ui.html