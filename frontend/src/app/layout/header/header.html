<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand" aria-label="Fintech System home">
      <span class="brand-mark">F</span>
      <span class="brand-name">Fintech System</span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Dashboard</a>
      <a routerLink="/wallets" routerLinkActive="active" class="nav-link">Wallets</a>
      <a routerLink="/exchange" routerLinkActive="active" class="nav-link">Exchange</a>
      <a routerLink="/admin" routerLinkActive="active" class="nav-link">Admin</a>
    </nav>

    <div class="header-actions">
      <span class="user-chip">SmartJk123</span>
    </div>
  </div>
</header>
