<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand" aria-label="EliteWallet home">
      <span class="brand-mark">E</span>
      <span class="brand-name">EliteWallet</span>
    </a>

    @if (auth.isAuthenticated()) {
      <nav class="main-nav" aria-label="Main navigation">
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Dashboard</a>
        <a routerLink="/deposit" routerLinkActive="active" class="nav-link">Deposit</a>
        <a routerLink="/withdraw" routerLinkActive="active" class="nav-link">Withdraw</a>
        <a routerLink="/transactions" routerLinkActive="active" class="nav-link">Transactions</a>
      </nav>
      <div class="header-actions">
        <span class="user-chip">{{ auth.user()?.fullName || auth.user()?.email }}</span>
        <button type="button" class="btn-logout" (click)="auth.logout()">Logout</button>
      </div>
    } @else {
      <div class="header-actions">
        <a routerLink="/login" class="nav-link">Login</a>
        <a routerLink="/register" class="btn btn-golden btn-sm">Register</a>
      </div>
    }
  </div>
</header>
