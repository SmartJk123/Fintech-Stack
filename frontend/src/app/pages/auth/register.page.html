<section class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-mark">E</span>
      <h1>Create your wallet</h1>
      <p>Multi-currency balances, M-Pesa and crypto rails.</p>
    </div>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <label class="field">
        <span>Full name</span>
        <input formControlName="fullName" type="text" placeholder="Jane Doe" autocomplete="name" />
      </label>

      <label class="field">
        <span>Email</span>
        <input formControlName="email" type="email" placeholder="you@example.com" autocomplete="email" />
      </label>

      <label class="field">
        <span>Password (min 8 characters)</span>
        <input formControlName="password" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="new-password" />
      </label>

      <button type="submit" class="btn btn-golden btn-block" [disabled]="busy() || form.invalid">
        {{ busy() ? 'Creating…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-alt">Already registered? <a routerLink="/login">Sign in</a></p>
  </div>
</section>
